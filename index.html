<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <title>お金の管理</title>
  <link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
  <header class="app-header">
    <h1>お金の管理</h1>
  </header>

  <main>
    <section class="panel result">
      <label>見たい日付<input type="date" id="targetDate"></label>
      <div class="remain-label" id="remainLabel">残り</div>
      <div class="remain" id="remain">¥0</div>
    </section>

    <section class="panel">
      <h2>今の残高</h2>
      <label>金額（円）<input type="number" id="balance" inputmode="numeric" step="1" placeholder="100000"></label>
    </section>

    <section class="panel">
      <h2>給料</h2>
      <div class="row">
        <label>給料日<select id="payday"></select></label>
        <label>金額（円）<input type="number" id="salary" inputmode="numeric" min="0" step="1" placeholder="250000"></label>
      </div>
    </section>

    <section class="panel">
      <h2>引き落とし・支払い</h2>
      <ul id="itemList" class="item-list"></ul>
      <button type="button" id="addItem" class="add">＋ 追加</button>
    </section>
  </main>

  <footer class="version" id="versionInfo" title="デプロイ情報">
    v__VERSION__ · __DEPLOYED_AT__
  </footer>

  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
