<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <title>お金の管理</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="お金の管理">
  <link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
  <header class="app-header">
    <h1>お金の管理</h1>
  </header>

  <main>
    <section class="panel cal-panel">
      <div class="legend">
        <span><i class="sw low"></i>引き落とし後〜給料日（本当の貯金）</span>
        <span><i class="sw high"></i>給料日後〜引き落とし</span>
        <span><b class="minus-text">赤字</b>＝マイナス</span>
      </div>
      <div class="legend">
        <span><b>残高</b>：その日の口座残高（変わる日だけ表示）</span>
        <span><b class="use-text">使える</b>：その日にカードで使っていい金額。その分が引き落とされた後も、本当の貯金（その引き落とし後〜次の給料日の残高）がマイナスにならない上限</span>
      </div>
      <div class="month-nav" id="monthTitle"></div>
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="panel">
      <h2>今の残高</h2>
      <label>金額（円）<input type="text" id="balance" class="money" inputmode="numeric" autocomplete="off"></label>
    </section>

    <section class="panel">
      <h2>給料</h2>
      <div class="row">
        <label>給料日<select id="payday"></select></label>
        <label>金額（円）<input type="number" id="salary" inputmode="numeric" min="0" step="1"></label>
      </div>
    </section>

    <section class="panel">
      <h2>クレジット</h2>
      <div class="row mb">
        <label>締日<select id="closingDay"></select></label>
        <label>引き落とし日（締日の翌月）<select id="withdrawDay"></select></label>
      </div>
      <div class="row">
        <label><span id="nextText">次の引き落とし額</span><input type="number" id="nextAmount" inputmode="numeric" min="0" step="1"></label>
        <label><span id="afterText">次の月の引き落とし額</span><input type="number" id="afterAmount" inputmode="numeric" min="0" step="1"></label>
        <label><span id="thirdText">その次の月の引き落とし額</span><input type="number" id="thirdAmount" inputmode="numeric" min="0" step="1"></label>
      </div>
    </section>

    <section class="panel">
      <h2>固定費</h2>
      <ul id="fixedList" class="fixed-list"></ul>
      <button type="button" id="addFixed" class="add">＋ 追加</button>
    </section>
  </main>

  <footer class="version" id="versionInfo" title="デプロイ情報">
    v__VERSION__ · __DEPLOYED_AT__
  </footer>

  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
