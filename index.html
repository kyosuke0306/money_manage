<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <title>お金の管理</title>
  <link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
  <header class="app-header">
    <h1>お金の管理</h1>
  </header>

  <main>
    <section class="panel result">
      <div class="result-label">使っていい金額（マイナスにならない上限）</div>
      <div class="result-value" id="canSpend">¥0</div>
      <div class="result-note" id="lowestNote"></div>
    </section>

    <section class="panel">
      <div class="legend">
        <span><i class="sw low"></i>引き落とし後〜給料日（本当の貯金）</span>
        <span><i class="sw high"></i>給料日後〜引き落とし</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="panel">
      <h2>今の残高</h2>
      <label>金額（円）<input type="number" id="balance" inputmode="numeric" step="1" placeholder="100000"></label>
    </section>

    <section class="panel">
      <h2>給料</h2>
      <div class="row">
        <label>給料日<select id="payday"></select></label>
        <label>金額（円）<input type="number" id="salary" inputmode="numeric" min="0" step="1" placeholder="250000"></label>
      </div>
    </section>

    <section class="panel">
      <h2>引き落とし</h2>
      <label class="mb">引き落とし日<select id="withdrawDay"></select></label>
      <div class="row">
        <label><span id="nextText">次の引き落とし額（円）</span><input type="number" id="nextAmount" inputmode="numeric" min="0" step="1" placeholder="80000"></label>
        <label><span id="afterText">次の次の引き落とし額（円）</span><input type="number" id="afterAmount" inputmode="numeric" min="0" step="1" placeholder="80000"></label>
      </div>
    </section>
  </main>

  <footer class="version" id="versionInfo" title="デプロイ情報">
    v__VERSION__ · __DEPLOYED_AT__
  </footer>

  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
